<!-- O'YIN MA'LUMOTI: index.html shu yerdan nom, belgi va narxni o'qiydi.
     data-id Google Sheets dagi Games jadvalidagi id bilan bir xil bo'lishi kerak -->
<div class="game-info" hidden
     data-id="worm"
     data-name="Worm Escape"
     data-icon="🐛"
     data-desc="2 kishilik poyga. Qurtchalarni birinchi bo‘lib chiqaring!"
     data-cost="3"
     data-prize="5"></div>

<style>
  #worm { position: fixed; inset: 0; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          background: linear-gradient(180deg, #0a0220 0%, #2a0a5e 50%, #6b1b8f 100%);
          overflow: hidden; touch-action: manipulation; }
  #worm::before { content: ''; position: absolute; inset: 0; pointer-events: none;
                  background: radial-gradient(circle at 15% 20%, #ec489944, transparent 55%),
                              radial-gradient(circle at 90% 45%, #22d3ee33, transparent 55%); }
  #worm * { box-sizing: border-box; }
  #worm .app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 8px; gap: 7px;
               max-width: 600px; margin: auto; }
  #worm header { position: static; z-index: auto; background: none; box-shadow: none; padding: 0; height: 48px;
                 display: flex; justify-content: space-between; align-items: center; gap: 6px;
                 color: #fff; font-size: 18px; font-weight: 800; flex: none; text-shadow: 0 2px 6px #0008; }
  #worm header #wmPrize { display: flex; align-items: center; gap: 5px; background: #12062ecc; border: 2px solid #ffffff2a;
                          border-radius: 30px; padding: 4px 12px; font-size: 16px; }
  #worm button { border: 0; border-radius: 14px; padding: 10px 15px; font-weight: 800; font-size: 15px;
                 background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; cursor: pointer; font-family: inherit; }
  #worm button:active { transform: scale(.96); }
  #worm button:disabled { opacity: .4; }
  #worm header #wmSound { width: 44px; height: 40px; padding: 0; background: #ffffff1f; border: 1px solid #ffffff2a; }
  #worm .stats { display: flex; gap: 8px; align-items: stretch; flex: none; }
  #worm .me { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; font-weight: 700; color: #fff; }
  #worm .hearts { font-size: 23px; }
  #worm .msg { font-size: 13px; min-height: 30px; color: #c4b5fd; }
  #worm .tbar { height: 8px; border-radius: 6px; background: #0006; overflow: hidden; }
  #worm .tbar b { display: block; height: 100%; width: 100%; background: #22d3ee; transition: width .3s linear, background .3s; }
  #worm .opp { width: 30%; max-width: 120px; flex: none; background: #ffffff14; border: 1px solid #ffffff2a;
               border-radius: 16px; padding: 6px; text-align: center; font-size: 11px; font-weight: 700; color: #fff; }
  #worm .opp .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #worm .opp canvas { display: block; width: 100%; aspect-ratio: 10 / 14; border-radius: 10px; margin: 3px 0;
                      background: linear-gradient(150deg, #1e0b4a, #12062e); }
  #worm .opp #wmOppLeft { color: #c4b5fd; }
  #worm #wmBoard { flex: 1; min-height: 0; width: 100%; display: block; border-radius: 22px;
                   background: linear-gradient(150deg, #24104f, #120632); border: 2px solid #a78bfa66;
                   box-shadow: 0 0 24px #8b5cf655, inset 0 0 30px #00000066; touch-action: manipulation; }
  #worm footer { display: flex; gap: 8px; padding-bottom: calc(5px + env(safe-area-inset-bottom)); flex: none; }
  #worm footer button { flex: 1; font-size: 14px; padding: 11px 6px; }
  #worm footer #wmHome { background: #ffffff1f; border: 1px solid #ffffff2a; }
  #worm footer .red { background: linear-gradient(135deg, #ef4444, #be185d); color: #fff; }
  #worm .ov { position: absolute; inset: 0; background: #0b0220cc; display: flex; align-items: center;
              justify-content: center; padding: 20px; z-index: 5; backdrop-filter: blur(3px); }
  #worm .panel { width: 100%; max-width: 330px; max-height: 100%; overflow: auto;
                 background: linear-gradient(180deg, #2a1068, #14073a); color: #fff;
                 border-radius: 24px; padding: 25px; text-align: center; border: 2px solid #a78bfa;
                 box-shadow: 0 0 30px #8b5cf666; }
  #worm .panel h2 { color: #f0abfc; margin: 0 0 8px; }
  #worm .panel p { margin: 8px 0; font-size: 14px; line-height: 1.7; color: #e9d5ff; }
  #worm .panel .coin { vertical-align: -3px; }
  #worm .panel button { margin: 6px 4px 0; }
  #worm .panel button.ghost { background: #ffffff22; color: #fff; }
</style>

<div id="worm">
  <div class="app">
    <header>
      <span>🐛 Worm Escape</span>
      <span id="wmPrize"></span>
      <button id="wmSound">🔊</button>
    </header>

    <div class="stats">
      <div class="me">
        <div class="hearts" id="wmHearts">❤️❤️❤️</div>
        <div class="msg" id="wmMsg">Yuklanmoqda…</div>
        <div class="tbar" id="wmTbar" hidden><b id="wmTfill"></b></div>
      </div>
      <!-- Raqib o'yini ko'rinadigan oyna -->
      <div class="opp">
        <div class="nm" id="wmOppName">Raqib</div>
        <canvas id="wmOpp"></canvas>
        <div id="wmOppLeft">—</div>
      </div>
    </div>

    <canvas id="wmBoard"></canvas>

    <footer>
      <button id="wmHint">💡 Yordam</button>
      <button id="wmHome">🏠 Bosh sahifa</button>
      <button class="red" id="wmLeave" hidden>🚪 Chiqish</button>
    </footer>
  </div>

  <div class="ov" id="wmOv" hidden><div class="panel" id="wmPanel"></div></div>
</div>

<script>
window.game_worm = (function () {
  var GAME = 'worm';
  var COST = 3;          // server yuborgan qiymat bilan yangilanadi
  var FEE = 1;           // egasi ulushi (serverdagi CONFIG.FEE bilan bir xil)
  var COLORS = ['#ff4d8d', '#22d3ee', '#34d399', '#a78bfa', '#fbbf24', '#fb7185'];
  var COINH = '<i class="coin s"></i>';
  var EXIT_SPEED = 13;   // qurtcha chiqish tezligi (katak/soniya). Tezroq uchun oshiring, sekinroq uchun kamaytiring

  var TG = window.Telegram && window.Telegram.WebApp;
  var $ = function (id) { return document.getElementById(id); };
  var root = $('worm'), app = root.querySelector('.app');
  var cv = $('wmBoard'), ctx = cv.getContext('2d');
  var oc = $('wmOpp'), octx = oc.getContext('2d');

  var cols = 10, rows = 14, cell = 20, ox = 0, oy = 0, mcell = 5, mox = 0, moy = 0;
  var roomId = null, view = null, timer = null, gen = 0, active = false;
  var recvAt = 0, uiTimer = null, finishedShown = null;
  var worms = [], myAlive = [], myLives = 3, queue = [], sending = false;
  var selected = -1, muted = false, audio = null, msgUntil = 0, ovKey = '', joining = false, booting = false;
  var anims = {}, shakes = {}, raf = 0;

  function ini() { return window.APP.initData; }
  function haptic(t) { try { TG.HapticFeedback.impactOccurred(t || 'light'); } catch (e) {} }
  function hapticOk() { try { TG.HapticFeedback.notificationOccurred('success'); } catch (e) {} }
  function prize() { return COST * 2 - FEE; }
  function pending() { return queue.length + (sending ? 1 : 0); }
  function leftCount(a) { var n = 0; for (var i = 0; i < (a ? a.length : 0); i++) if (a[i]) n++; return n; }

  function ask(text, cb) {
    if (TG && TG.showConfirm) {
      try { TG.showConfirm(text, function (ok) { if (ok) cb(); }); return; } catch (e) {}
    }
    if (confirm(text)) cb();
  }

  // Telegram yuqori paneli tugmalarni yopib qo'ymasligi uchun
  function applyInsets() {
    var top = 8;
    try {
      if (TG && TG.isFullscreen) {
        var a = (TG.safeAreaInset && TG.safeAreaInset.top) || 0;
        var b = (TG.contentSafeAreaInset && TG.contentSafeAreaInset.top) || 0;
        top += (a + b) || 72;
      }
    } catch (e) {}
    app.style.paddingTop = top + 'px';
  }

  /* ---------- Ovoz ---------- */
  function sound(type) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      var osc = audio.createOscillator();
      var gain = audio.createGain();
      osc.connect(gain);
      gain.connect(audio.destination);
      var notes = type === 'bad' ? [180, 120] : type === 'win' ? [500, 650, 800] : [350, 500];
      var t = audio.currentTime;
      notes.forEach(function (n, i) { osc.frequency.setValueAtTime(n, t + i * 0.09); });
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + notes.length * 0.1 + 0.05);
      osc.start(t);
      osc.stop(t + notes.length * 0.1 + 0.1);
    } catch (e) {}
  }

  /* ---------- Qoidalar (serverdagi bilan bir xil) ---------- */
  function blocked(alive, skip, x, y) {
    for (var i = 0; i < worms.length; i++) {
      if (i === skip || !alive[i]) continue;
      var c = worms[i].cells;
      for (var j = 0; j < c.length; j++) if (c[j][0] === x && c[j][1] === y) return true;
    }
    return false;
  }

  function canExit(id, alive) {
    var w = worms[id];
    var x = w.cells[0][0] + w.dx, y = w.cells[0][1] + w.dy;
    while (x >= 0 && x < cols && y >= 0 && y < rows) {
      if (blocked(alive, id, x, y)) return false;
      x += w.dx; y += w.dy;
    }
    return true;
  }

  // Boshdan chegaragacha nechta katak bor
  function rayLen(w) {
    var n = 0, x = w.cells[0][0] + w.dx, y = w.cells[0][1] + w.dy;
    while (x >= 0 && x < cols && y >= 0 && y < rows) { n++; x += w.dx; y += w.dy; }
    return n;
  }

  /* ---------- Chizish ---------- */
  function sizeCanvas(c) {
    var r = c.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    c.width = Math.max(1, Math.round(r.width * dpr));
    c.height = Math.max(1, Math.round(r.height * dpr));
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    return r;
  }

  function resize() {
    var r = sizeCanvas(cv);
    cell = Math.max(1, Math.min((r.width - 24) / cols, (r.height - 24) / rows));
    ox = (r.width - cols * cell) / 2;
    oy = (r.height - rows * cell) / 2;
    var r2 = sizeCanvas(oc);
    mcell = Math.max(1, Math.min((r2.width - 6) / cols, (r2.height - 6) / rows));
    mox = (r2.width - cols * mcell) / 2;
    moy = (r2.height - rows * mcell) / 2;
    draw();
  }

  function circle(c, x, y, r, color) {
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fillStyle = color;
    c.fill();
  }

  function drawHead(c, hx, hy, w, cs) {
    var px = -w.dy, py = w.dx;
    // ko'zlar
    circle(c, hx + w.dx * cs * 0.12 + px * cs * 0.12, hy + w.dy * cs * 0.12 + py * cs * 0.12, cs * 0.075, 'white');
    circle(c, hx + w.dx * cs * 0.12 - px * cs * 0.12, hy + w.dy * cs * 0.12 - py * cs * 0.12, cs * 0.075, 'white');
    circle(c, hx + w.dx * cs * 0.15 + px * cs * 0.13, hy + w.dy * cs * 0.15 + py * cs * 0.13, cs * 0.035, '#183b2b');
    circle(c, hx + w.dx * cs * 0.15 - px * cs * 0.13, hy + w.dy * cs * 0.15 - py * cs * 0.13, cs * 0.035, '#183b2b');
  }

  function drawArrow(c, hx, hy, w, cs) {
    var px = -w.dy, py = w.dx;
    var tx = hx + w.dx * cs * 0.78, ty = hy + w.dy * cs * 0.78;
    var bx = hx + w.dx * cs * 0.46, by = hy + w.dy * cs * 0.46;
    c.beginPath();
    c.moveTo(tx, ty);
    c.lineTo(bx + px * cs * 0.17, by + py * cs * 0.17);
    c.lineTo(bx - px * cs * 0.17, by - py * cs * 0.17);
    c.closePath();
    c.fillStyle = 'rgba(255,255,255,.92)';
    c.fill();
  }

  function drawWorms(c, alive, cs, bx, by, big) {
    var now = performance.now();
    for (var i = 0; i < worms.length; i++) {
      var w = worms[i];
      if (!alive[i]) continue;
      var color = COLORS[w.c % COLORS.length];

      c.save();
      if (big && shakes[i]) {
        var el = now - shakes[i];
        if (el < 380) c.translate(Math.sin(el * 0.06) * cs * 0.1 * (1 - el / 380), 0);
        else delete shakes[i];
      }

      // Yordam: tanlangan qurtcha yo'li (punktir chiziq)
      if (big && selected === i) {
        var h0 = w.cells[0];
        c.beginPath();
        c.moveTo(bx + (h0[0] + 0.5) * cs, by + (h0[1] + 0.5) * cs);
        c.lineTo(bx + (h0[0] + 0.5 + w.dx * (rayLen(w) + 0.5)) * cs, by + (h0[1] + 0.5 + w.dy * (rayLen(w) + 0.5)) * cs);
        c.setLineDash([cs * 0.18, cs * 0.18]);
        c.strokeStyle = '#ffffffaa';
        c.lineWidth = 2;
        c.stroke();
        c.setLineDash([]);
      }

      for (var k = w.cells.length - 1; k >= 0; k--) {
        var p = w.cells[k];
        var x = bx + (p[0] + 0.5) * cs, y = by + (p[1] + 0.5) * cs;
        if (big) circle(c, x + 1, y + 2, cs * 0.39, '#00000055');
        circle(c, x, y, cs * 0.37, color);
        if (big) circle(c, x - cs * 0.10, y - cs * 0.12, cs * 0.09, '#ffffff66');
      }

      var h = w.cells[0];
      var hx = bx + (h[0] + 0.5) * cs, hy = by + (h[1] + 0.5) * cs;
      if (big) {
        drawHead(c, hx, hy, w, cs);
        drawArrow(c, hx, hy, w, cs);
        if (selected === i) {
          c.beginPath();
          c.arc(hx, hy, cs * 0.47, 0, Math.PI * 2);
          c.strokeStyle = 'white';
          c.lineWidth = 3;
          c.stroke();
        }
      } else {
        // kichik oynada ham yo'nalish ko'rinsin
        drawArrow(c, hx, hy, w, cs * 0.9);
      }
      c.restore();
    }
  }

  // Qurtcha tanasi chiqish yo'li bo'ylab siljiydi
  function posAt(w, i) {
    var len = w.cells.length;
    if (i < 0) i = 0;
    if (i <= len - 1) return [w.cells[len - 1 - i][0] + 0.5, w.cells[len - 1 - i][1] + 0.5];
    var h = w.cells[0], s = i - (len - 1);
    return [h[0] + 0.5 + w.dx * s, h[1] + 0.5 + w.dy * s];
  }

  function drawAnim(id, t) {
    var w = worms[id];
    if (!w) return false;
    var len = w.cells.length;
    var end = len + rayLen(w) + 1;
    if (t >= end) return false;
    var color = COLORS[w.c % COLORS.length];
    for (var k = len - 1; k >= 0; k--) {
      var idx = (len - 1 - k) + t;
      var i0 = Math.floor(idx), f = idx - i0;
      var a = posAt(w, i0), b = posAt(w, i0 + 1);
      var x = ox + (a[0] + (b[0] - a[0]) * f) * cell;
      var y = oy + (a[1] + (b[1] - a[1]) * f) * cell;
      circle(ctx, x + 1, y + 2, cell * 0.39, '#00000040');
      circle(ctx, x, y, cell * 0.37, color);
      circle(ctx, x - cell * 0.10, y - cell * 0.12, cell * 0.09, '#ffffff66');
      if (k === 0) drawHead(ctx, x, y, w, cell);
    }
    return true;
  }

  function oppAlive() {
    if (!view || !view.state || !view.state.alive || view.seat < 0) return [];
    return view.state.alive[1 - view.seat] || [];
  }

  function draw() {
    var W = cv.clientWidth, H = cv.clientHeight;
    ctx.clearRect(0, 0, W, H);
    for (var y = 10; y < H; y += 32) {
      for (var x = 10; x < W; x += 32) circle(ctx, x, y, 1, '#ffffff30');
    }
    drawWorms(ctx, myAlive, cell, ox, oy, true);

    var now = performance.now(), busy = false;
    for (var id in anims) {
      var t = (now - anims[id]) / 1000 * EXIT_SPEED;
      if (drawAnim(+id, t)) busy = true; else delete anims[id];
    }
    for (var s in shakes) busy = true;

    octx.clearRect(0, 0, oc.clientWidth, oc.clientHeight);
    drawWorms(octx, oppAlive(), mcell, mox, moy, false);

    if (busy && !raf) raf = requestAnimationFrame(function () { raf = 0; draw(); });
  }

  /* ---------- Matn va panellar ---------- */
  function say(t) { $('wmMsg').textContent = t; msgUntil = Date.now() + 1800; }

  function setOv(key, html, bind) {
    if (key === ovKey) return;
    ovKey = key;
    $('wmPanel').innerHTML = html;
    $('wmOv').hidden = false;
    if (bind) bind();
  }

  function renderOv() {
    var st = view ? view.status : '';
    if (!roomId) {
      if (joining || booting) {
        setOv('load', '<h2>Yuklanmoqda…</h2>');
      } else {
        setOv('join',
          '<h2>🐛 Worm Escape</h2>' +
          '<p>💰 Kirish: <b>' + COST + '</b> ' + COINH + ' · G‘olib: <b>' + prize() + '</b> ' + COINH + '</p>' +
          '<p>🐛 Ikkala o‘yinchi bir xil boshqotirmani yechadi<br>' +
          '➡️ Qurtcha boshidagi strelka uning chiqish yo‘nalishi<br>' +
          '🏁 Qurtchalarni birinchi bo‘lib chiqargan g‘alaba qozonadi<br>' +
          '❤️ 3 ta jon: yo‘li band qurtchani bossangiz jon ketadi<br>' +
          '👀 Raqib jarayoni yuqoridagi kichik oynada ko‘rinadi<br>' +
          '⏰ 90 soniya harakat qilmasangiz yutqazasiz<br>' +
          '❌ Raqib 10 daqiqada topilmasa, Nova qaytariladi</p>' +
          '<button id="wmJoin">🎟 Qo‘shilish (' + COST + ' ' + COINH + ')</button>' +
          '<button class="ghost" id="wmBack">🏠 Bosh sahifa</button>',
          function () { $('wmJoin').onclick = joinGame; $('wmBack').onclick = goHome; });
      }
    } else if (!view) {
      setOv('load', '<h2>Yuklanmoqda…</h2>');
    } else if (st === 'waiting') {
      setOv('wait',
        '<h2>👥 Raqib kutilmoqda</h2>' +
        '<p>🏆 G‘olib mukofoti: <b>' + (view.prize || prize()) + '</b> ' + COINH + '</p>' +
        '<p>⏱ Xona <b id="wmWt">10:00</b> dan keyin yopiladi</p>' +
        '<button class="ghost" id="wmCancel">❌ Bekor qilish (' + COST + ' ' + COINH + ' qaytadi)</button>',
        function () { $('wmCancel').onclick = leave; });
    } else if (st === 'finished') {
      if (ovKey !== 'res') { ovKey = 'none'; $('wmOv').hidden = true; }
    } else {
      ovKey = 'none';
      $('wmOv').hidden = true;
    }
  }

  function render() {
    var V = view, S = (V && V.state) || {}, st = V ? V.status : '';
    var wait = st === 'waiting', playing = st === 'playing', fin = st === 'finished';
    if (V && V.cost) COST = V.cost;

    $('wmPrize').innerHTML = '🏆 ' + (V && V.prize ? V.prize : prize()) + ' ' + COINH;
    var lv = Math.max(0, myLives);
    $('wmHearts').textContent = '❤️'.repeat(lv) + '🖤'.repeat(3 - lv);
    $('wmTbar').hidden = !playing;
    $('wmLeave').hidden = !(wait || playing);
    $('wmHint').disabled = !playing || myLives <= 0;

    var opp = (V && V.seat >= 0) ? 1 - V.seat : -1;
    $('wmOppName').textContent = (V && opp >= 0 && V.names[opp]) ? V.names[opp] : 'Raqib';
    $('wmOppLeft').textContent = (S.alive && opp >= 0 && S.alive[opp]) ? leftCount(S.alive[opp]) + ' ta qoldi' : '—';

    if (Date.now() > msgUntil) {
      var m;
      if (!roomId) m = 'Raqib bilan poygalashing!';
      else if (!V) m = 'Yuklanmoqda…';
      else if (wait) m = '⏳ Raqib kutilmoqda';
      else if (fin) m = S.winner === V.seat ? '🎉 Siz g‘olibsiz!' : '🏆 G‘olib: ' + (V.names[S.winner] || '—');
      else m = leftCount(myAlive) === 0 ? 'Tekshirilmoqda…' : leftCount(myAlive) + ' ta qurtcha qoldi';
      $('wmMsg').textContent = m;
    }

    renderOv();
    draw();
    updateTimers();
  }

  function updateTimers() {
    if (!view) return;
    var el = (performance.now() - recvAt) / 1000;
    if (view.status === 'playing') {
      var left = Math.max(0, view.turnLeft - el);
      var pct = Math.max(0, Math.min(100, left / view.afk * 100));
      var f = $('wmTfill');
      f.style.width = pct + '%';
      f.style.background = pct < 25 ? '#ef4444' : (pct < 55 ? '#fbbf24' : '#22d3ee');
    } else if (view.status === 'waiting') {
      var w = Math.max(0, Math.round(view.waitLeft - el));
      var m = Math.floor(w / 60), s = w % 60;
      var t = $('wmWt');
      if (t) t.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    }
  }

  function showResult() {
    var V = view, S = V.state;
    var me = S.winner === V.seat;
    ovKey = 'res';
    $('wmPanel').innerHTML =
      '<div style="font-size:56px">' + (me ? '🏆' : '😔') + '</div>' +
      '<h2>' + (me ? 'AJOYIB! 🎉 +' + V.prize + ' ' + COINH : 'Yutqazdingiz') + '</h2>' +
      '<p>' + (me ? 'Siz birinchi bo‘lib tugatdingiz!' : 'G‘olib: ' + window.esc(V.names[S.winner] || '—')) + '</p>' +
      '<button id="wmAgain">🔁 Yana o‘ynash</button>' +
      '<button class="ghost" id="wmBack2">🏠 Bosh sahifa</button>';
    $('wmOv').hidden = false;
    $('wmAgain').onclick = function () { newGame(); };
    $('wmBack2').onclick = function () { goHome(); };
    if (me) { hapticOk(); sound('win'); } else { sound('bad'); }
  }

  /* ---------- Holatni qabul qilish ---------- */
  function applyView(v) {
    if (view && view.status === 'finished' && v.status === 'playing') return;
    if (view && view.state && v.state && view.state.n != null && v.state.n != null &&
        v.state.n < view.state.n && v.status === view.status) return;   // eskirgan javob

    view = v;
    recvAt = performance.now();

    if (v.status === 'cancelled') {
      stopPoll(); roomId = null; view = null; queue.length = 0;
      window.toast('Kutish vaqti tugadi. Nova qaytarildi');
      if (window.refreshApp) window.refreshApp();
      render();
      return;
    }

    var S = v.state || {};
    if ((v.status === 'playing' || v.status === 'finished') && S.worms) {
      worms = S.worms;
      cols = S.cols || cols;
      rows = S.rows || rows;
      if (v.seat >= 0 && S.alive && (pending() === 0 || v.status === 'finished')) {
        myAlive = S.alive[v.seat].slice();
        myLives = S.lives[v.seat];
      }
    }

    render();

    if (v.status === 'finished') {
      stopPoll();
      queue.length = 0;
      if (window.refreshApp) window.refreshApp();
      if (finishedShown !== roomId) { finishedShown = roomId; showResult(); }
    }
  }

  /* ---------- Yurish ---------- */
  function tap(e) {
    if (!view || view.status !== 'playing' || myLives <= 0) return;
    var rect = cv.getBoundingClientRect();
    var x = (e.clientX - rect.left - ox) / cell;
    var y = (e.clientY - rect.top - oy) / cell;
    var best = -1, dist = Infinity;
    for (var i = 0; i < worms.length; i++) {
      if (!myAlive[i]) continue;
      var c = worms[i].cells;
      for (var j = 0; j < c.length; j++) {
        var d = Math.pow(c[j][0] + 0.5 - x, 2) + Math.pow(c[j][1] + 0.5 - y, 2);
        if (d < dist) { dist = d; best = i; }
      }
    }
    if (best >= 0 && dist < 1.5) moveWorm(best);
  }

  // Yurish darrov ekranda ko'rinadi, serverga navbat bilan yuboriladi
  function moveWorm(id) {
    selected = -1;
    if (canExit(id, myAlive)) {
      myAlive[id] = false;
      anims[id] = performance.now();      // chiqish animatsiyasi
      sound('ok');
      haptic('light');
      say('Zo‘r! Davom eting.');
    } else {
      myLives--;
      shakes[id] = performance.now();     // yo'li band: qurtcha silkinadi
      sound('bad');
      haptic('heavy');
      say('Yo‘l band! Boshqasini tanlang.');
    }
    queue.push(id);
    pump();
    render();
  }

  function pump() {
    if (sending || !queue.length || !roomId) return;
    sending = true;
    var id = queue.shift();
    window.gcall('wormMove', ini(), roomId, id)
      .then(applyView)
      .catch(function (e) { window.toast(e.message); queue.length = 0; })
      .then(function () { sending = false; if (queue.length) pump(); });
  }

  /* ---------- Xona ---------- */
  function resetLocal() {
    worms = []; myAlive = []; myLives = 3; queue.length = 0; sending = false; selected = -1;
    anims = {}; shakes = {};
  }

  function joinGame() {
    if (joining) return;
    joining = true;
    renderOv();
    window.gcall('joinRoom', ini(), GAME, 2).then(function (r) {
      roomId = r.roomId;
      view = null; resetLocal();
      window.toast('Xonaga qo‘shildingiz');
      if (window.refreshApp) window.refreshApp();
      startPoll();
    }).catch(function (e) { window.toast(e.message); })
      .then(function () { joining = false; render(); });
  }

  function newGame() {
    roomId = null; view = null; ovKey = ''; resetLocal();
    render();
    joinGame();
  }

  function leave() {
    if (!roomId) return;
    var w = view && view.status === 'waiting';
    ask(w ? 'Xonadan chiqasizmi? ' + COST + ' Nova qaytariladi.'
          : 'O‘yindan chiqsangiz yutqazasiz va Nova qaytmaydi. Chiqasizmi?', function () {
      window.gcall('leaveRoom', ini(), roomId).then(function (r) {
        stopPoll();
        roomId = null; view = null; ovKey = ''; resetLocal();
        window.toast(r && r.refund ? r.refund + ' Nova qaytarildi' : 'O‘yindan chiqdingiz');
        if (window.refreshApp) window.refreshApp();
        render();
      }).catch(function (e) { window.toast(e.message); });
    });
  }

  function goHome() {
    if (view && view.status === 'playing') window.toast('O‘yin davom etmoqda, harakatsiz qolmang!');
    window.closeGame(GAME);
  }

  function hint() {
    if (!view || view.status !== 'playing') return;
    for (var i = 0; i < worms.length; i++) {
      if (myAlive[i] && canExit(i, myAlive)) {
        selected = i;
        say('Oq halqadagi qurtchani bosing!');
        sound('tap');
        draw();
        return;
      }
    }
    say('Boshqa yo‘lni tekshiring!');
  }

  /* ---------- So'rov (polling) ---------- */
  function startPoll() { gen++; clearTimeout(timer); tick(gen); }
  function stopPoll() { gen++; clearTimeout(timer); }
  function tick(g) {
    if (g !== gen || !roomId) return;
    window.gcall('getRoomState', ini(), roomId)
      .then(function (v) { if (g === gen) applyView(v); })
      .catch(function () {})
      .then(function () {
        if (g === gen && (!view || (view.status !== 'finished' && view.status !== 'cancelled'))) {
          timer = setTimeout(function () { tick(g); }, (view && view.status === 'waiting') ? 2500 : 1200);
        }
      });
  }

  /* ---------- Ochish / yopish ---------- */
  var backH = function () { goHome(); };

  function open() {
    active = true;
    applyInsets();
    view = null; ovKey = ''; resetLocal(); booting = true;
    roomId = null;
    try { if (TG && TG.BackButton) { TG.BackButton.onClick(backH); TG.BackButton.show(); } } catch (e) {}
    clearInterval(uiTimer);
    uiTimer = setInterval(updateTimers, 500);
    render();
    requestAnimationFrame(resize);
    window.gcall('getMyRoom', ini(), GAME).then(function (id) {
      roomId = id;
      booting = false;
      if (roomId) startPoll();
      render();
    }).catch(function (e) { booting = false; window.toast(e.message); render(); });
  }

  function close() {
    active = false;
    clearInterval(uiTimer);
    stopPoll();
    try { if (TG && TG.BackButton) { TG.BackButton.offClick(backH); TG.BackButton.hide(); } } catch (e) {}
  }

  cv.addEventListener('pointerdown', tap);
  $('wmHint').onclick = hint;
  $('wmHome').onclick = goHome;
  $('wmLeave').onclick = leave;
  $('wmSound').onclick = function (e) {
    muted = !muted;
    e.target.textContent = muted ? '🔇' : '🔊';
    if (!muted) sound('tap');
  };
  window.addEventListener('resize', function () { if (active) resize(); });

  return { open: open, close: close };
})();
</script>
