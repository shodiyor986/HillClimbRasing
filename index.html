<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>O'yin Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#0f1220; --card:#1a1f35; --acc:#7c5cff; --gold:#ffc83d; --txt:#fff; --mut:#9aa3c7; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt); padding-bottom: 92px; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 5; background: var(--card); padding: 12px 16px;
             display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 10px #0006; }
    .coins { background: #2b2350; padding: 6px 12px; border-radius: 20px; color: var(--gold); font-weight: 700; }
    .page { display: none; padding: 14px; }
    .page.active { display: block; }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .mut { color: var(--mut); font-size: 13px; }
    .btn { background: var(--acc); color: #fff; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: .4; }
    h3 { margin: 6px 0 10px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex;
          justify-content: space-around; align-items: flex-end; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
          box-shadow: 0 -2px 10px #0006; z-index: 10; }
    nav button { background: none; border: 0; color: var(--mut); font-size: 12px; flex: 1;
                 display: flex; flex-direction: column; align-items: center; gap: 2px; }
    nav button.active { color: #fff; }
    nav .ic { font-size: 22px; line-height: 1; }
    nav button.center .ic { width: 58px; height: 58px; border-radius: 50%; background: var(--acc);
                            display: flex; align-items: center; justify-content: center; font-size: 28px;
                            margin-top: -28px; box-shadow: 0 6px 16px #7c5cff99; }
    .overlay { position: fixed; inset: 0; background: #000d; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 12px; z-index: 50; font-size: 18px; }
    .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #2b3150;
             padding: 10px 16px; border-radius: 12px; z-index: 60; max-width: 90%; text-align: center; }
    .game-screen { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow: auto; padding: 14px; }
    .err { background: #3a1f2b; border: 1px solid #a33; color: #ffb3b3; border-radius: 12px; padding: 12px;
           margin: 12px 14px; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div>
      <b id="uname">Yuklanmoqda…</b>
      <div class="mut" id="urank"></div>
    </div>
    <div class="coins">🪙 <span id="ucoins">0</span></div>
  </header>

  <div class="err" id="errbox" hidden>
    <div id="errtext"></div>
    <button class="btn" style="margin-top:10px" onclick="retryLoad()">🔄 Qayta urinish</button>
  </div>

  <!-- VAZIFALAR -->
  <section class="page" id="p-tasks">
    <h3>✅ Vazifalar</h3>
    <div id="tasks"><div class="card mut">Yuklanmoqda…</div></div>
  </section>

  <!-- O'YINLAR (markaz) -->
  <section class="page active" id="p-games">
    <h3>🎮 O‘yinlar</h3>
    <div id="games"><div class="card mut">Yuklanmoqda…</div></div>
  </section>

  <!-- PROFIL + REYTING -->
  <section class="page" id="p-profile">
    <div class="card">
      <div class="row">
        <div><b id="pname"></b><div class="mut" id="pun"></div></div>
        <div class="coins">🪙 <span id="pcoins"></span></div>
      </div>
      <div class="mut" style="margin-top:8px">O‘rin: <b id="prank"></b> · G‘alabalar: <b id="pwins"></b></div>
    </div>
    <h3>🏆 Reyting</h3>
    <div class="card" id="lb"></div>
  </section>

  <nav>
    <button data-page="tasks" onclick="showPage('tasks')"><span class="ic">✅</span>Vazifalar</button>
    <button data-page="games" class="center" onclick="showPage('games')"><span class="ic">🎮</span>O‘yinlar</button>
    <button data-page="profile" onclick="showPage('profile')"><span class="ic">👤</span>Profil</button>
  </nav>

  <div class="overlay" id="adbox" hidden>
    <div>📺 Reklama yuklanmoqda…</div>
    <div style="font-size:40px" id="adsec">5</div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <!-- O'yin ekranlari shu yerga avtomatik qo'shiladi -->
  <div id="gameScreens"></div>

<script>
  // ============================================================
  // 1) Apps Script manzili
  // ============================================================
  var API_URL = 'https://script.google.com/macros/s/AKfycbx1lmkyETJ1YYCpU3cAylORiptKxfcCIIH6m2bzmVFOuBIw4ADoZ2iCPPA2PdTQF7dd_Q/exec');

  // ============================================================
  // 2) O'YINLAR RO'YXATI
  // GitHub'dagi o'yin fayllarining nomini shu yerga yozing.
  // Yangi o'yin qo'shish uchun: faylni GitHub'ga yuklang va nomini shu ro'yxatga yozing.
  // Masalan:  var GAME_FILES = ['B1.html', 'B2.html', 'B3.html'];
  // ============================================================
  var GAME_FILES = ['B1.html'];

  var $ = function (id) { return document.getElementById(id); };

  window.onerror = function (msg) {
    try { showError('Xato: ' + msg); } catch (e) {}
  };
  window.onunhandledrejection = function (ev) {
    try { showError('Xato: ' + (ev && ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); } catch (e) {}
  };

  function showError(text) {
    $('uname').textContent = 'Xato';
    $('errtext').textContent = '⚠️ ' + text;
    $('errbox').hidden = false;
  }
  function hideError() { $('errbox').hidden = true; }

  // ---------- Telegram ma'lumoti ----------
  var TG = window.Telegram && window.Telegram.WebApp;
  if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }

  function initDataFromHash() {
    try {
      var h = String(location.hash || '').replace(/^#/, '');
      var parts = h.split('&');
      for (var i = 0; i < parts.length; i++) {
        var k = parts[i].indexOf('=');
        if (k > 0 && parts[i].slice(0, k) === 'tgWebAppData') {
          return decodeURIComponent(parts[i].slice(k + 1));
        }
      }
    } catch (e) {}
    return '';
  }

  window.APP = { initData: (TG && TG.initData) || initDataFromHash() || '' };

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  };
  window.esc = esc;

  // ---------- Serverga so'rov ----------
  function gcall(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    var opts = { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) };
    if (ctrl) opts.signal = ctrl.signal;
    return fetch(API_URL, opts)
      .then(function (r) { return r.text(); })
      .then(function (txt) {
        clearTimeout(timer);
        var j;
        try { j = JSON.parse(txt); }
        catch (e) { throw new Error('Server noto\'g\'ri javob berdi. Apps Script yangi versiya deploy qilinganini tekshiring'); }
        if (!j.ok) throw new Error(j.error || 'Server xatosi');
        return j.data;
      }, function (e) {
        clearTimeout(timer);
        if (e && e.name === 'AbortError') throw new Error('Server javob bermadi. Qayta urinib ko\'ring');
        throw new Error('Internet yoki server bilan aloqa yo\'q (' + (e && e.message ? e.message : 'xato') + ')');
      });
  }
  window.gcall = gcall;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.hidden = true; }, 2800);
  }
  window.toast = toast;

  // ============================================================
  // O'YIN FAYLLARINI GITHUB'DAN O'QISH
  // Har bir fayl (masalan B1.html) o'qiladi, ichidagi o'yin ma'lumoti (game-info)
  // olinadi, o'yin oynasi yaratiladi va bosh sahifada karta chiqadi.
  // ============================================================
  var GAMES = {};        // id -> {id, name, icon, desc, cost, prize, file}
  var GAME_ORDER = [];   // id lar tartibi
  var GAME_ERRORS = [];  // o'qilmagan fayllar

  function loadGameFile(file) {
    return fetch(file + '?v=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error(file + ' topilmadi (GitHub\'ga yuklanganini tekshiring)');
        return r.text();
      })
      .then(function (html) {
        var box = document.createElement('div');
        box.innerHTML = html;

        var info = box.querySelector('.game-info');
        if (!info) throw new Error(file + ' ichida game-info yo\'q');
        var id = info.getAttribute('data-id');
        if (!id) throw new Error(file + ': game-info da data-id yo\'q');
        var meta = {
          id: id,
          file: file,
          name: info.getAttribute('data-name') || id,
          icon: info.getAttribute('data-icon') || '🎮',
          desc: info.getAttribute('data-desc') || '',
          cost: Number(info.getAttribute('data-cost') || 0),
          prize: Number(info.getAttribute('data-prize') || 0)
        };
        info.parentNode.removeChild(info);

        var scripts = Array.prototype.slice.call(box.querySelectorAll('script'));
        scripts.forEach(function (s) { s.parentNode.removeChild(s); });

        var screen = document.createElement('div');
        screen.className = 'game-screen';
        screen.id = 'screen-' + id;
        screen.hidden = true;
        while (box.firstChild) screen.appendChild(box.firstChild);
        $('gameScreens').appendChild(screen);

        scripts.forEach(function (old) {
          var s = document.createElement('script');
          s.textContent = old.textContent;
          document.body.appendChild(s);
        });

        GAMES[id] = meta;
        if (GAME_ORDER.indexOf(id) < 0) GAME_ORDER.push(id);
      })
      .catch(function (e) {
        GAME_ERRORS.push(e.message);
      });
  }

  function loadAllGames() {
    return Promise.all(GAME_FILES.map(loadGameFile)).then(renderGames);
  }

  function renderGames() {
    var html = GAME_ORDER.map(function (id) {
      var g = GAMES[id];
      var cost = g.cost, prize = g.prize;
      // Server (Games jadvali) narxni o'zgartirgan bo'lsa, shuni ko'rsatadi
      if (DATA && DATA.games) {
        var sg = DATA.games.filter(function (x) { return x.id === id; })[0];
        if (sg) { cost = sg.cost; prize = sg.prize; }
      }
      return '<div class="card row" style="cursor:pointer" onclick="openGame(\'' + esc(id) + '\')">' +
        '<div style="font-size:34px">' + esc(g.icon) + '</div>' +
        '<div style="flex:1"><b>' + esc(g.name) + '</b>' +
        '<div class="mut">' + esc(g.desc) + '</div>' +
        '<div class="mut">🎟 ' + cost + ' 🪙 · 🏆 ' + prize + ' 🪙</div></div>' +
        '<span style="font-size:20px">▶</span></div>';
    }).join('');

    GAME_ERRORS.forEach(function (m) {
      html += '<div class="card" style="color:#ffb3b3">⚠️ ' + esc(m) + '</div>';
    });

    $('games').innerHTML = html || '<div class="card mut">O‘yinlar yo‘q</div>';
  }

  function openGame(id) {
    var el = $('screen-' + id);
    if (!el) { toast('O‘yin topilmadi'); return; }
    if (!APP.initData) { toast('Iltimos, botni Telegram ichidan oching'); return; }
    el.hidden = false;
    var api = window['game_' + id];
    if (api && api.open) api.open();
  }

  function closeGame(id) {
    var el = $('screen-' + id);
    if (el) el.hidden = true;
    var api = window['game_' + id];
    if (api && api.close) api.close();
    refresh();
  }
  window.openGame = openGame;
  window.closeGame = closeGame;

  // ---------- Foydalanuvchi ma'lumotini yuklash ----------
  var DATA = null;
  var loading = false;

  function refresh() {
    if (loading) return Promise.resolve();
    loading = true;
    return gcall('getAppData', APP.initData).then(function (d) {
      DATA = d;
      hideError();
      render();
    }).catch(function (e) {
      if (!DATA) showError(e.message); else toast('⚠️ ' + e.message);
    }).then(function () { loading = false; });
  }
  window.refreshApp = refresh;

  function retryLoad() {
    hideError();
    $('uname').textContent = 'Yuklanmoqda…';
    refresh();
  }
  window.retryLoad = retryLoad;

  function render() {
    if (!DATA) return;
    var d = DATA, m = d.me;
    $('uname').textContent = m.name;
    $('urank').textContent = '🏆 Reyting: #' + m.rank;
    $('ucoins').textContent = m.coins;
    $('pname').textContent = m.name;
    $('pun').textContent = m.username ? '@' + m.username : '';
    $('pcoins').textContent = m.coins;
    $('prank').textContent = '#' + m.rank;
    $('pwins').textContent = m.wins;

    $('tasks').innerHTML = d.tasks.map(function (t) {
      var full = t.done >= t.limit;
      return '<div class="card row">' +
        '<div><b>' + esc(t.title) + '</b><div class="mut">+' + t.reward + ' 🪙 · bugun ' + t.done + '/' + t.limit + '</div></div>' +
        '<button class="btn" ' + (full ? 'disabled' : '') + ' onclick="watchAd(\'' + esc(t.id) + '\')">' + (full ? 'Tugadi' : 'Ko‘rish') + '</button>' +
        '</div>';
    }).join('') || '<div class="card mut">Hozircha vazifa yo‘q</div>';

    $('lb').innerHTML = d.leaderboard.map(function (u, i) {
      return '<div class="row" style="padding:7px 4px;' + (u.me ? 'color:var(--gold);font-weight:700' : '') + '">' +
        '<span>' + (i + 1) + '. ' + esc(u.name) + '</span><span>🪙 ' + u.coins + '</span></div>';
    }).join('');

    renderGames();
  }

  // ---------- Reklama (vazifa) ----------
  // Haqiqiy reklama tarmog'i SDK sini shu yerga ulang
  var adTimer = null;
  function watchAd(taskId) {
    $('adbox').hidden = false;
    var n = 5;
    $('adsec').textContent = n;
    clearInterval(adTimer);
    adTimer = setInterval(function () {
      n--;
      $('adsec').textContent = n;
      if (n <= 0) {
        clearInterval(adTimer);
        $('adbox').hidden = true;
        claim(taskId);
      }
    }, 1000);
  }
  window.watchAd = watchAd;

  function claim(taskId) {
    gcall('claimTask', APP.initData, taskId).then(function (r) {
      toast('+' + r.reward + ' 🪙 qo‘shildi!');
      refresh();
    }).catch(function (e) { toast('⚠️ ' + e.message); });
  }

  // ---------- Sahifalar ----------
  function showPage(p) {
    document.querySelectorAll('.page').forEach(function (x) { x.classList.toggle('active', x.id === 'p-' + p); });
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-page') === p); });
  }
  window.showPage = showPage;

  // ---------- Ishga tushirish ----------
  showPage('games');
  loadAllGames();                 // o'yin fayllari GitHub'dan o'qiladi (serverga bog'liq emas)
  if (!APP.initData) {
    $('uname').textContent = 'Telegram aniqlanmadi';
    $('tasks').innerHTML = '<div class="card mut">Botni Telegram ichidan oching</div>';
  } else {
    refresh();                    // foydalanuvchi, tanga, reyting serverdan olinadi
  }
</script>
</body>
</html>
