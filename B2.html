
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hill Climb 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
#game{width:100vw;height:100vh}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:20px}
button{width:75px;height:75px;border-radius:50%;border:2px solid white;background:#173d59;color:white;font-size:25px;font-weight:bold}
#hud{position:fixed;top:15px;left:15px;color:white;font-size:20px;font-weight:bold;text-shadow:1px 2px 4px black}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">MASOFA: <span id="distance">0</span> m</div>
<div id="controls">
<button id="brake">◀</button>
<button id="gas">▶</button>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.set(-6,5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

const groundMaterial=new THREE.MeshStandardMaterial({color:0x65a943,side:THREE.DoubleSide});

function hill(x){
return Math.sin(x*.4)*.7+Math.sin(x*.9)*.25+x*.01;
}

const vertices=[];
const indices=[];

for(let x=-30;x<300;x+=.5){
let y=hill(x);
vertices.push(x,y,-15,x,y,15);
}

for(let i=0;i<658;i++){
let a=i*2;
indices.push(a,a+1,a+2,a+1,a+3,a+2);
}

const geometry=new THREE.BufferGeometry();
geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
geometry.setIndex(indices);
geometry.computeVertexNormals();

const ground=new THREE.Mesh(geometry,groundMaterial);
scene.add(ground);

const car=new THREE.Group();
scene.add(car);

const red=new THREE.MeshStandardMaterial({color:0xe53935});
const black=new THREE.MeshStandardMaterial({color:0x222222});

const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.6,1),red);
body.position.y=.7;
car.add(body);

const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.1,.7,.9),red);
cabin.position.set(-.2,1.3,0);
car.add(cabin);

const wheels=[];

for(let x of [-.7,.8]){
for(let z of [-.6,.6]){
const wheel=new THREE.Mesh(
new THREE.CylinderGeometry(.38,.38,.22,20),
black
);
wheel.rotation.x=Math.PI/2;
wheel.position.set(x,.35,z);
car.add(wheel);
wheels.push(wheel);
}
}

let position=0;
let speed=0;
let active=false;

const keys={gas:false,brake:false};

function control(id,key){
const button=document.getElementById(id);
button.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[key]=true;
});
['pointerup','pointercancel','pointerleave'].forEach(event=>{
button.addEventListener(event,e=>{
keys[key]=false;
});
});
}

control('gas','gas');
control('brake','brake');

window.addEventListener('keydown',e=>{
if(e.key==='ArrowRight')keys.gas=true;
if(e.key==='ArrowLeft')keys.brake=true;
});

window.addEventListener('keyup',e=>{
if(e.key==='ArrowRight')keys.gas=false;
if(e.key==='ArrowLeft')keys.brake=false;
});

active=true;

function animate(){
requestAnimationFrame(animate);

let dt=.016;

if(active){
if(keys.gas)speed+=.12;
if(keys.brake)speed-=.18;

speed-=.015;
speed=Math.max(0,Math.min(speed,1.5));

position+=speed*dt*8;

car.position.set(position,hill(position)+.95,0);

const slope=(hill(position+.05)-hill(position-.05))/.1;
car.rotation.z=Math.atan(slope);

wheels.forEach(w=>w.rotation.z-=speed*.1);

camera.position.lerp(
new THREE.Vector3(position-6,car.position.y+5,10),
.05
);

camera.lookAt(position+3,car.position.y,0);

document.getElementById('distance').textContent=Math.floor(position);
}

renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
